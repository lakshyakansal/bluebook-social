services:
  - type: web
    name: bluebook-social
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/bluebook.sqlite
    disk:
      name: bluebook-data
      mountPath: /var/data
      sizeGB: 1
